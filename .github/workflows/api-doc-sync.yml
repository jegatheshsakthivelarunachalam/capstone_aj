name: API Documentation Sync

on:
  pull_request:
    paths:
      - "src/**"
      - "app/**"
      - "openapi/**"
      - "docs/api.md"
      - ".github/doc-sync.yml"
      - "package.json"
      - "pom.xml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  build:
    name: Generate and check API documentation
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted verification implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Checkout pull-request application source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -r pr-app/requirements.txt
          python -m pip install -e pr-app

      - name: Generate documentation and check drift
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python -m api_doc_sync `
            --config pr-app/.github/doc-sync.yml `
            --app-root pr-app `
            --baseline-root . `
            --report build/api-doc-sync-report.json `
            --patch build/docs-api.patch

      - name: Upload drift report and patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-doc-sync-report
          path: build/
          retention-days: 5

  reporting:
    name: Report API documentation drift
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download drift report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: api-doc-sync-report
          path: build

      - name: Create or update summary comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "build/api-doc-sync-report.json";
            const { owner, repo } = context.repo;
            let report = null;
            let reportInvalid = false;

            if (fs.existsSync(path)) {
              try {
                const stat = fs.statSync(path);
                if (stat.size > 1024 * 1024) {
                  reportInvalid = true;
                } else {
                  report = JSON.parse(fs.readFileSync(path, "utf8"));
                  if (
                    typeof report.has_drift !== "boolean" ||
                    typeof report.missing_baseline !== "boolean" ||
                    !Array.isArray(report.changed_facts) ||
                    !Array.isArray(report.missing_facts) ||
                    typeof report.path_count !== "number" ||
                    typeof report.schema_count !== "number"
                  ) {
                    reportInvalid = true;
                    report = null;
                  }
                }
              } catch (error) {
                reportInvalid = true;
                report = null;
              }
            }

            if (!report && !reportInvalid) {
              report = {
                has_drift: true,
                missing_baseline: false,
                changed_facts: ["artifact unavailable"],
                missing_facts: ["reported evidence unavailable"],
                path_count: 0,
                schema_count: 0
              };
            } else if (reportInvalid) {
              report = {
                has_drift: true,
                missing_baseline: false,
                changed_facts: ["invalid report artifact"],
                missing_facts: ["reported evidence unavailable"],
                path_count: 0,
                schema_count: 0
              };
            }

            let artifactUrl = null;
            try {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: context.runId,
                per_page: 100
              });
              const artifact = artifacts.data.artifacts.find(
                item => item.name === "api-doc-sync-report" && !item.expired
              );
              if (artifact) {
                artifactUrl =
                  `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
              }
            } catch (error) {
              core.warning("Could not resolve the API documentation patch artifact.");
            }

            const marker = "<!-- api-doc-sync-drift -->";
            const body = [
              marker,
              "## API documentation drift detected",
              `- Changed fact groups: ${report.changed_facts.length}`,
              `- Paths: ${report.path_count}`,
              `- Schemas: ${report.schema_count}`,
              `- Missing facts: ${report.missing_facts.length}`,
              `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            ];
            if (artifactUrl) {
              body.push(`[Suggested patch](${artifactUrl})`);
            }
            const bodyText = body.join("\n");

            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              comment => comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: bodyText
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: bodyText
              });
            }
