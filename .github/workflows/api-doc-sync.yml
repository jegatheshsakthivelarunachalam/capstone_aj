name: API Documentation Sync

on:
  pull_request:
    paths:
      - "src/**"
      - "app/**"
      - "openapi/**"
      - "docs/api.md"
      - ".github/doc-sync.yml"
      - "package.json"
      - "pom.xml"
      - "requirements.txt"
      - "tests/integration/mock_app.py"
      - ".github/workflows/api-doc-sync.yml"

permissions:
  contents: read

jobs:
  build:
    name: Generate and check API documentation
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted verification implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Checkout pull-request application source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -r pr-app/requirements.txt
          python -m pip install -e pr-app

      - name: Generate documentation and check drift
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python -m api_doc_sync `
            --config pr-app/.github/doc-sync.yml `
            --app-root pr-app `
            --baseline-root . `
            --report build/api-doc-sync-report.json `
            --patch build/docs-api.patch

      - name: Upload drift report and patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-doc-sync-report
          path: build/
          retention-days: 5

  reporting:
    name: Report API documentation drift
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download drift report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: api-doc-sync-report
          path: build

      - name: Create or update summary comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "build/api-doc-sync-report.json";
            const { owner, repo } = context.repo;
            let report = null;
            let reportInvalid = false;

            if (fs.existsSync(path)) {
              try {
                const stat = fs.statSync(path);
                if (stat.size > 1024 * 1024) {
                  reportInvalid = true;
                } else {
                  report = JSON.parse(fs.readFileSync(path, "utf8"));
                  if (
                    typeof report.has_drift !== "boolean" ||
                    typeof report.missing_baseline !== "boolean" ||
                    !Array.isArray(report.changed_facts) ||
                    !Array.isArray(report.missing_facts) ||
                    typeof report.path_count !== "number" ||
                    typeof report.schema_count !== "number"
                  ) {
                    reportInvalid = true;
                    report = null;
                  }
                }
              } catch (error) {
                reportInvalid = true;
                report = null;
              }
            }

            if (!report && !reportInvalid) {
              report = {
                has_drift: true,
                missing_baseline: false,
                changed_facts: ["artifact unavailable"],
                missing_facts: ["reported evidence unavailable"],
                path_count: 0,
                schema_count: 0
              };
            } else if (reportInvalid) {
              report = {
                has_drift: true,
                missing_baseline: false,
                changed_facts: ["invalid report artifact"],
                missing_facts: ["reported evidence unavailable"],
                path_count: 0,
                schema_count: 0
              };
            }

            let artifactUrl = null;
            try {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: context.runId,
                per_page: 100
              });
              const artifact = artifacts.data.artifacts.find(
                item => item.name === "api-doc-sync-report" && !item.expired
              );
              if (artifact) {
                artifactUrl =
                  `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
              }
            } catch (error) {
              core.warning("Could not resolve the API documentation patch artifact.");
            }

            const marker = "<!-- api-doc-sync-drift -->";

            const statusTitle = reportInvalid
              ? "## API documentation check failed"
              : report.missing_baseline
              ? "## API documentation baseline missing"
              : report.has_drift
              ? "## API documentation drift detected"
              : "## API documentation is up to date";

            const changes =
              report.changes && typeof report.changes === "object"
                ? report.changes
                : {};

            // Keep untrusted API identifiers inside inline code.
            const inline = value =>
              "`" + String(value).replace(/[\r\n]/g, " ").replace(/`/g, "ˋ") + "`";

            const details = [];
            const maxDetails = 100;
            const maxValuesPerLine = 20;

            const appendList = (label, key) => {
              const values = Array.isArray(changes[key]) ? changes[key] : [];
              if (values.length === 0) return;

              const shown = values.slice(0, maxValuesPerLine).map(inline);
              const remaining = values.length - shown.length;
              const suffix = remaining > 0 ? ` (+${remaining} more)` : "";

              details.push(`- ${label}: ${shown.join(", ")}${suffix}`);
            };

            const appendGrouped = (label, key) => {
              const groups =
                changes[key] && typeof changes[key] === "object"
                  ? changes[key]
                  : {};

              for (const [schema, fields] of Object.entries(groups)) {
                if (!Array.isArray(fields) || fields.length === 0) continue;

                const shown = fields.slice(0, maxValuesPerLine).map(inline);
                const remaining = fields.length - shown.length;
                const suffix = remaining > 0 ? ` (+${remaining} more)` : "";

                details.push(
                  `- ${label} (${inline(schema)}): ${shown.join(", ")}${suffix}`
                );
              }
            };

            appendList("Added paths", "added_paths");
            appendList("Removed paths", "removed_paths");
            appendList("Modified paths", "modified_paths");

            appendList("Added operations", "added_operations");
            appendList("Removed operations", "removed_operations");
            appendList("Modified operations", "modified_operations");

            appendList("Added schemas", "added_schemas");
            appendList("Removed schemas", "removed_schemas");
            appendList("Modified schemas", "modified_schemas");

            appendGrouped("Added fields", "added_schema_fields");
            appendGrouped("Removed fields", "removed_schema_fields");
            appendGrouped("Modified fields", "modified_schema_fields");

            const displayedDetails = details.slice(0, maxDetails);
            if (details.length > maxDetails) {
              displayedDetails.push(
                `- ${details.length - maxDetails} additional change entries omitted; see the report artifact.`
              );
            }

            const body = [
              marker,
              statusTitle,
              `- Changed fact groups: ${report.changed_facts.length}`,
              `- Paths: ${report.path_count}`,
              `- Schemas: ${report.schema_count}`,
              `- Missing facts: ${report.missing_facts.length}`,
              ...(displayedDetails.length > 0
                ? ["", "### Detected changes", ...displayedDetails]
                : []),
              `[Workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`
            ];

            if (artifactUrl) {
              body.push(`[Suggested patch](${artifactUrl})`);
            }

            const bodyText = body.join("\n");
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              comment => comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: bodyText
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: bodyText
              });
            }

            